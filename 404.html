<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Paris Carrelages et Matériaux</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0D3A5C; color:#F6F4ED; font-family:Georgia, serif; text-align:center; padding:40px 20px; }
  h1 { font-weight:500; font-size:clamp(56px,12vw,110px); margin:0; }
  p { color:rgba(246,244,237,.75); font-family:system-ui, sans-serif; }
  a.btn { display:inline-block; margin-top:28px; background:#A8623E; color:#fff; padding:14px 26px; font-family:system-ui,sans-serif; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; text-decoration:none; }
  a.btn:hover { background:#8C4E2E; }
</style>
</head>
<body>
  <div class="e404">
    <h1>404</h1>
    <p>Cette page n'existe pas — mais le comptoir, lui, est ouvert dès 6 h 30.</p>
    <a class="btn" id="homeLink" href="index.html">Retour à l'accueil</a>
  </div>
  <script>
    // GitHub Pages sert 404.html à n'importe quelle profondeur d'URL :
    // on reconstruit le chemin racine du site (sous-dossier du dépôt inclus).
    (function () {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var base = parts.length > 0 ? "/" + parts[0] + "/" : "/";
      document.getElementById("homeLink").href = base + "index.html";
    })();
  </script>
</body>
</html>
